
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEVER | Personal Profile</title>
<link rel="stylesheet" href="style.css">

<style>
:root {
  --red: #e32636;
  --black: #080808;
  --white: #f5f5f5;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
  background:
    radial-gradient(circle at top, #ff0026, transparent 45%),
    #080808;
  color: var(--white);
  font-family: Arial, sans-serif;
}

.card {
  width: 100%;
  max-width: 650px;
  padding: 55px 35px;
  text-align: center;
  border: 1px solid #ffffff20;
  border-top: 2px solid var(--red);
  border-radius: 22px;
  background: rgba(20,20,20,.85);
  box-shadow: 0 20px 80px #000;
  backdrop-filter: blur(15px);
  animation: appear 1s ease;
}

.tag {
  color: var(--red);
  font-size: 11px;
  letter-spacing: 6px;
  text-transform: uppercase;
}

h1 {
  margin: 25px 0 10px;
  font-size: clamp(55px, 12vw, 90px);
  font-weight: 900;
  letter-spacing: 12px;
  text-shadow: 0 0 30px #e3263640;
}

.subtitle {
  color: #aaa;
  font-size: 12px;
  letter-spacing: 4px;
}

.line {
  width: 55px;
  height: 2px;
  margin: 30px auto;
  background: var(--red);
}

.description {
  color: #aaa;
  line-height: 2;
  font-size: 15px;
}

.info {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 12px;
  margin: 30px 0;
}

.info span {
  padding: 12px 16px;
  border: 1px solid #ffffff20;
  border-radius: 30px;
  color: #ddd;
  font-size: 11px;
}

a {
  display: inline-block;
  padding: 14px 25px;
  color: white;
  background: var(--red);
  border-radius: 7px;
  text-decoration: none;
  font-size: 11px;
  letter-spacing: 2px;
  transition: .3s;
}

a:hover {
  transform: translateY(-4px);
  box-shadow: 0 0 25px #e3263670;
}

footer {
  margin-top: 35px;
  color: #555;
  font-size: 10px;
  letter-spacing: 3px;
}

footer span {
  color: var(--red);
}

@keyframes appear {
  from {
    opacity: 0;
    transform: translateY(25px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@media(max-width: 480px) {
  .card { padding: 40px 20px; }
  h1 { letter-spacing: 7px; }
}
</style>
</head>

<body>

  <span></span><span></span><span></span><span></span>

</div>

<div class="card">

  <h1>NEVER</h1>

  <div class="subtitle">
    PLAYER FF · NEVER TRUST
  </div>

  <div class="line"></div>

  <p class="description">
    A little mystery, a lot of personality.<br>
    Welcome to my own world.
  </p>

  <div class="info">
    <span>✦ NEVERSAME</span>
